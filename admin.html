<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonify Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b14;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 20px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .card {
      background: #121725;
      padding: 20px;
      border-radius: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #293147;
      border-radius: 12px;
      background: #0d111c;
      color: white;
      outline: none;
    }

    input[type="file"] {
      padding: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .edit {
      background: #334155;
      color: white;
    }

    .delete {
      background: #7f1d1d;
      color: white;
    }

    .logout {
      background: #252b3a;
      color: white;
    }

    .cancel {
      background: #252b3a;
      color: white;
    }

    #adminPanel {
      display: none;
    }

    #loginStatus,
    #status {
      text-align: center;
      margin-top: 15px;
      color: #9ca3af;
      min-height: 20px;
    }

    .song {
      background: #121725;
      padding: 15px;
      border-radius: 14px;
      margin-top: 10px;
    }

    .artist {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 5px;
    }

    .song-url {
      color: #667085;
      font-size: 11px;
      margin-top: 6px;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      margin-top: 10px;
    }

    .file-label {
      display: block;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 16px;
    }

    .hint {
      color: #737b8f;
      font-size: 12px;
      margin-top: 7px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🌙 Moonify Admin</h1>
  <div class="subtitle">Admin Panel</div>

  <!-- LOGIN -->
  <div class="card" id="loginPanel">

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      🔐 Login
    </button>

    <div id="loginStatus"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <div class="card">

      <input
        id="title"
        type="text"
        placeholder="Song Title"
      >

      <input
        id="artist"
        type="text"
        placeholder="Artist"
      >

      <label class="file-label">
        🎵 Select MP3 File
      </label>

      <input
        id="audioFile"
        type="file"
        accept="audio/mpeg,audio/mp3,.mp3"
      >

      <div class="hint">
        MP3 file select karo. Upload hone ke baad Moonify mein
        built-in audio player se play hoga.
      </div>

      <input
        id="url"
        type="url"
        placeholder="Direct MP3 URL (optional)"
      >
      <input
  id="audioFile"
  type="file"
  accept=".mp3,audio/mpeg"
>

      <div class="hint">
        Agar MP3 file upload nahi karni, to direct MP3 URL de sakte ho.
      </div>

      <button
        id="publishButton"
        onclick="handlePublishOrUpdate()"
      >
        🚀 Publish Song
      </button>

      <button
        id="cancelButton"
        class="cancel"
        onclick="cancelEdit()"
        style="display:none;"
      >
        Cancel Edit
      </button>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

      <div id="status"></div>

    </div>


    <h2 style="margin-top:30px;">
      Published Songs
    </h2>

    <div id="songList"></div>

  </div>

</div>


<script>

let supabaseClient = null;
let editingId = null;


/* =========================
   INITIALIZE
========================= */

async function init() {

  try {

    const response =
      await fetch("/api/config");

    if (!response.ok) {
      throw new Error(
        "Could not load configuration."
      );
    }

    const config =
  await response.json();

console.log("SUPABASE URL:", config.url);

if (!config.url || !config.key) {
      throw new Error(
        "Supabase configuration is missing."
      );
    }

    supabaseClient =
      window.supabase.createClient(
        config.url,
        config.key
      );

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();

    if (session) {
      showAdminPanel();
    }

  } catch (error) {

    document.getElementById(
      "loginStatus"
    ).textContent =
      "❌ " + error.message;

  }

}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  const status =
    document.getElementById(
      "loginStatus"
    );

  if (!email || !password) {

    status.textContent =
      "⚠️ Email and password required.";

    return;
  }

  status.textContent =
    "Logging in...";

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    status.textContent =
      "❌ " + error.message;

    return;
  }

  status.textContent = "";

  showAdminPanel();
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  editingId = null;

  document.getElementById(
    "adminPanel"
  ).style.display = "none";

  document.getElementById(
    "loginPanel"
  ).style.display = "block";

  clearForm();
}


/* =========================
   SHOW ADMIN
========================= */

function showAdminPanel() {

  document.getElementById(
    "loginPanel"
  ).style.display = "none";

  document.getElementById(
    "adminPanel"
  ).style.display = "block";

  loadSongs();
}


/* =========================
   PUBLISH OR UPDATE
========================= */

async function handlePublishOrUpdate() {

  if (editingId !== null) {

    await updateSong();

  } else {

    await publishSong();

  }
}


/* =========================
   UPLOAD MP3
========================= */

async function uploadMP3(file) {

  if (!file) {
    return null;
  }

  if (
    file.type !== "audio/mpeg" &&
    !file.name.toLowerCase().endsWith(".mp3")
  ) {

    throw new Error(
      "Please select an MP3 file."
    );
  }

  const maxSize =
    100 * 1024 * 1024;

  if (file.size > maxSize) {

    throw new Error(
      "MP3 file must be smaller than 100 MB."
    );
  }

  const safeName =
    file.name
      .replace(/[^a-zA-Z0-9._-]/g, "_");

  const uniqueName =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 8) +
    "_" +
    safeName;

  const filePath =
    "uploads/" + uniqueName;


  const { error } =
    await supabaseClient
      .storage
      .from("songs")
      .upload(
        filePath,
        file,
        {
          contentType: "audio/mpeg",
          upsert: false
        }
      );

  if (error) {
    throw new Error(
      "MP3 upload failed: " +
      error.message
    );
  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("songs")
      .getPublicUrl(filePath);

  return data.publicUrl;
}


/* =========================
   PUBLISH SONG
========================= */

async function publishSong() {

  const title =
    document.getElementById(
      "title"
    ).value.trim();

  const artist =
    document.getElementById(
      "artist"
    ).value.trim();

  const file =
    document.getElementById(
      "audioFile"
    ).files[0];

  const directUrl =
    document.getElementById(
      "url"
    ).value.trim();

  const status =
    document.getElementById(
      "status"
    );


  if (!title || !artist) {

    status.textContent =
      "⚠️ Title and Artist are required.";

    return;
  }


  if (!file && !directUrl) {

    status.textContent =
      "⚠️ Select an MP3 file or enter a direct MP3 URL.";

    return;
  }


  try {

    status.textContent =
      "Uploading song...";

    let songUrl =
      directUrl;


    if (file) {

      songUrl =
        await uploadMP3(file);

    }


    status.textContent =
      "Publishing...";


    const { error } =
      await supabaseClient
        .from("songs")
        .insert({
          title: title,
          artist: artist,
          url: songUrl
        });


    if (error) {

      throw new Error(
        error.message
      );
    }


    status.textContent =
      "✅ Song published successfully!";

    clearForm();

    await loadSongs();

  } catch (error) {

    status.textContent =
      "❌ " + error.message;
  }
}


/* =========================
   START EDIT
========================= */

function startEdit(song) {

  editingId =
    song.id;

  document.getElementById(
    "title"
  ).value =
    song.title || "";

  document.getElementById(
    "artist"
  ).value =
    song.artist || "";

  document.getElementById(
    "url"
  ).value =
    song.url || "";

  document.getElementById(
    "audioFile"
  ).value = "";


  document.getElementById(
    "publishButton"
  ).textContent =
    "💾 Update Song";


  document.getElementById(
    "cancelButton"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).textContent =
    "Editing: " +
    (song.title || "Song");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   UPDATE SONG
========================= */

async function updateSong() {

  const title =
    document.getElementById(
      "title"
    ).value.trim();

  const artist =
    document.getElementById(
      "artist"
    ).value.trim();

  const file =
    document.getElementById(
      "audioFile"
    ).files[0];

  const currentUrl =
    document.getElementById(
      "url"
    ).value.trim();

  const status =
    document.getElementById(
      "status"
    );


  if (!title || !artist) {

    status.textContent =
      "⚠️ Title and Artist are required.";

    return;
  }


  try {

    status.textContent =
      "Updating...";


    let newUrl =
      currentUrl;


    if (file) {

      status.textContent =
        "Uploading new MP3...";

      newUrl =
        await uploadMP3(file);

    }


    if (!newUrl) {

      throw new Error(
        "MP3 URL is required."
      );
    }


    const { error } =
      await supabaseClient
        .from("songs")
        .update({
          title: title,
          artist: artist,
          url: newUrl
        })
        .eq("id", editingId);


    if (error) {

      throw new Error(
        error.message
      );
    }


    status.textContent =
      "✅ Song updated successfully!";

    editingId = null;

    clearForm();

    await loadSongs();

  } catch (error) {

    status.textContent =
      "❌ " + error.message;
  }
}


/* =========================
   DELETE SONG
========================= */

async function deleteSong(
  id,
  title
) {

  const confirmed =
    confirm(
      'Delete "' +
      title +
      '"?'
    );

  if (!confirmed) {
    return;
  }


  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    "Deleting...";


  const { error } =
    await supabaseClient
      .from("songs")
      .delete()
      .eq("id", id);


  if (error) {

    status.textContent =
      "❌ " + error.message;

    return;
  }


  status.textContent =
    "✅ Song deleted successfully!";


  if (editingId === id) {
    cancelEdit();
  }


  await loadSongs();
}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

  editingId = null;

  clearForm();

  document.getElementById(
    "status"
  ).textContent = "";
}


/* =========================
   CLEAR FORM
========================= */

function clearForm() {

  document.getElementById(
    "title"
  ).value = "";

  document.getElementById(
    "artist"
  ).value = "";

  document.getElementById(
    "url"
  ).value = "";

  document.getElementById(
    "audioFile"
  ).value = "";


  document.getElementById(
    "publishButton"
  ).textContent =
    "🚀 Publish Song";


  document.getElementById(
    "cancelButton"
  ).style.display =
    "none";
}


/* =========================
   LOAD SONGS
========================= */

async function loadSongs() {

  const list =
    document.getElementById(
      "songList"
    );


  const { data, error } =
    await supabaseClient
      .from("songs")
      .select(
        "id,title,artist,url"
      )
      .order(
        "id",
        {
          ascending: false
        }
      );


  if (error) {

    list.innerHTML =
      "<p style='color:#ff8585;'>❌ " +
      escapeHtml(
        error.message
      ) +
      "</p>";

    return;
  }


  if (!data || data.length === 0) {

    list.innerHTML =
      "<p style='color:#9ca3af;'>No songs yet.</p>";

    return;
  }


  list.innerHTML =
    data.map(song => `

      <div class="song">

        <strong>
          ${escapeHtml(
            song.title || "Unknown"
          )}
        </strong>

        <div class="artist">
          ${escapeHtml(
            song.artist || "Unknown Artist"
          )}
        </div>

        <div class="song-url">
          ${escapeHtml(
            song.url || ""
          )}
        </div>

        <div class="actions">

          <button
            class="edit"
            onclick='startEdit(${JSON.stringify(song)})'
          >
            ✏️ Edit
          </button>

          <button
            class="delete"
            onclick='deleteSong(
              ${song.id},
              ${JSON.stringify(
                song.title || "Song"
              )}
            )'
          >
            🗑️ Delete
          </button>

        </div>

      </div>

    `).join("");
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
