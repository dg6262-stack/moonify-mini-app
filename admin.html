<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonify Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b14;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 20px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .card {
      background: #121725;
      padding: 20px;
      border-radius: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #293147;
      border-radius: 12px;
      background: #0d111c;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .edit {
      background: #334155;
      color: white;
    }

    .delete {
      background: #7f1d1d;
      color: white;
    }

    .logout {
      background: #252b3a;
      color: white;
    }

    #adminPanel {
      display: none;
    }

    #loginStatus,
    #status {
      text-align: center;
      margin-top: 15px;
      color: #9ca3af;
      min-height: 20px;
    }

    .song {
      background: #121725;
      padding: 15px;
      border-radius: 14px;
      margin-top: 10px;
    }

    .artist {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 5px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🌙 Moonify Admin</h1>
  <div class="subtitle">Admin Panel</div>

  <!-- LOGIN -->
  <div class="card" id="loginPanel">

    <input id="email" type="email" placeholder="Admin Email">

    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">🔐 Login</button>

    <div id="loginStatus"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <div class="card">

      <input id="title" type="text" placeholder="Song Title">

      <input id="artist" type="text" placeholder="Artist">

      <input id="url" type="url" placeholder="YouTube URL">

      <button id="publishButton" onclick="publishSong()">
        🚀 Publish Song
      </button>

      <button id="cancelButton"
              onclick="cancelEdit()"
              style="display:none;">
        Cancel Edit
      </button>

      <button class="logout" onclick="logout()">
        Logout
      </button>

      <div id="status"></div>

    </div>

    <h2 style="margin-top:30px;">Published Songs</h2>

    <div id="songList"></div>

  </div>

</div>


<script>

let supabaseClient;
let editingId = null;


async function init() {

  try {

    const response = await fetch("/api/config");

    if (!response.ok) {
      throw new Error("Could not load configuration");
    }

    const config = await response.json();

    supabaseClient = window.supabase.createClient(
      config.url,
      config.key
    );

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
      showAdminPanel();
    }

  } catch (error) {

    document.getElementById("loginStatus").textContent =
      "❌ " + error.message;

  }

}


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const status =
    document.getElementById("loginStatus");

  if (!email || !password) {

    status.textContent =
      "⚠️ Email and password required.";

    return;

  }

  status.textContent = "Logging in...";

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    status.textContent =
      "❌ " + error.message;

    return;

  }

  status.textContent = "";

  showAdminPanel();

}


async function logout() {

  await supabaseClient.auth.signOut();

  editingId = null;

  document.getElementById("adminPanel").style.display = "none";
  document.getElementById("loginPanel").style.display = "block";

}


function showAdminPanel() {

  document.getElementById("loginPanel").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";

  loadSongs();

}


async function publishSong() {

  const title =
    document.getElementById("title").value.trim();

  const artist =
    document.getElementById("artist").value.trim();

  const url =
    document.getElementById("url").value.trim();

  const status =
    document.getElementById("status");

  if (!title || !artist || !url) {

    status.textContent =
      "⚠️ Please fill all fields.";

    return;

  }

  status.textContent = "Publishing...";

  const { error } =
    await supabaseClient
      .from("songs")
      .insert({
        title,
        artist,
        url
      });

  if (error) {

    status.textContent =
      "❌ " + error.message;

    return;

  }

  status.textContent =
    "✅ Song published successfully!";

  clearForm();

  loadSongs();

}


function startEdit(song) {

  editingId = song.id;

  document.getElementById("title").value =
    song.title || "";

  document.getElementById("artist").value =
    song.artist || "";

  document.getElementById("url").value =
    song.url || "";

  document.getElementById("publishButton").textContent =
    "💾 Update Song";

  document.getElementById("cancelButton").style.display =
    "block";

  document.getElementById("status").textContent =
    "Editing: " + song.title;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


async function updateSong() {

  const title =
    document.getElementById("title").value.trim();

  const artist =
    document.getElementById("artist").value.trim();

  const url =
    document.getElementById("url").value.trim();

  const status =
    document.getElementById("status");

  if (!title || !artist || !url) {

    status.textContent =
      "⚠️ Please fill all fields.";

    return;

  }

  status.textContent = "Updating...";

  const { error } =
    await supabaseClient
      .from("songs")
      .update({
        title,
        artist,
        url
      })
      .eq("id", editingId);

  if (error) {

    status.textContent =
      "❌ " + error.message;

    return;

  }

  status.textContent =
    "✅ Song updated successfully!";

  editingId = null;

  clearForm();

  loadSongs();

}


async function deleteSong(id, title) {

  const confirmed =
    confirm('Delete "' + title + '"?');

  if (!confirmed) return;

  const status =
    document.getElementById("status");

  status.textContent = "Deleting...";

  const { error } =
    await supabaseClient
      .from("songs")
      .delete()
      .eq("id", id);

  if (error) {

    status.textContent =
      "❌ " + error.message;

    return;

  }

  status.textContent =
    "✅ Song deleted successfully!";

  if (editingId === id) {
    cancelEdit();
  }

  loadSongs();

}


function cancelEdit() {

  editingId = null;

  clearForm();

  document.getElementById("status").textContent = "";

}


function clearForm() {

  document.getElementById("title").value = "";
  document.getElementById("artist").value = "";
  document.getElementById("url").value = "";

  document.getElementById("publishButton").textContent =
    "🚀 Publish Song";

  document.getElementById("cancelButton").style.display =
    "none";

}


async function loadSongs() {

  const list =
    document.getElementById("songList");

  const { data, error } =
    await supabaseClient
      .from("songs")
      .select("id,title,artist,url")
      .order("id", { ascending: false });

  if (error) {

    list.innerHTML =
      "<p style='color:#ff8585;'>❌ " +
      error.message +
      "</p>";

    return;

  }

  if (!data || data.length === 0) {

    list.innerHTML =
      "<p style='color:#9ca3af;'>No songs yet.</p>";

    return;

  }

  list.innerHTML = data.map(song => `

    <div class="song">

      <strong>${escapeHtml(song.title)}</strong>

      <div class="artist">
        ${escapeHtml(song.artist || "")}
      </div>

      <div class="actions">

        <button class="edit"
          onclick='startEdit(${JSON.stringify(song)})'>
          ✏️ Edit
        </button>

        <button class="delete"
          onclick='deleteSong(${song.id}, ${JSON.stringify(song.title)})'>
          🗑️ Delete
        </button>

      </div>

    </div>

  `).join("");

}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* Decide whether button should Publish or Update */

document.addEventListener("click", function(event) {

  if (
    event.target.id === "publishButton" &&
    editingId !== null
  ) {

    event.preventDefault();
    updateSong();

  }

});


init();

</script>

</body>
  </html>
