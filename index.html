<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonify</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background:
    radial-gradient(circle at top, #20204a 0%, #0b0b16 42%, #06060c 100%);
  color: #fff;
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 30px;
}

 /* HEADER */

.header {
  text-align: left;
  padding: 18px 4px 10px;
}

.logo {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #ffffff, #c89cff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 22px rgba(150, 80, 255, .20);
}

.subtitle {
  color: #9d95b5;
  margin-top: 5px;
  font-size: 13px;
}
    
/* SEARCH */

.search-wrap {
  position: relative;
  width: 100%;
  margin: 16px 0 24px;
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: #b9b1d0;
  font-size: 22px;
  line-height: 1;
  z-index: 2;
  pointer-events: none;
}

.search {
  width: 100%;
  box-sizing: border-box;
  padding: 15px 18px 15px 50px;
  border: 1px solid rgba(170, 100, 255, .16);
  outline: none;
  border-radius: 17px;
  background:
    linear-gradient(
      135deg,
      rgba(34, 25, 58, .96),
      rgba(20, 17, 36, .96)
    );
  color: #fff;
  font-size: 15px;
  box-shadow:
    0 8px 25px rgba(0, 0, 0, .22),
    inset 0 1px rgba(255, 255, 255, .04);
  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    transform .25s ease;
}

.search::placeholder {
  color: #8d86a5;
}

.search:focus {
  border-color: rgba(165, 100, 255, .55);
  box-shadow:
    0 0 0 3px rgba(130, 70, 255, .12),
    0 8px 28px rgba(80, 40, 160, .20);
}

/* WELCOME BANNER */

.welcome-card {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 210px;
  padding: 28px;
  margin-bottom: 28px;
  border-radius: 24px;
  background:
    radial-gradient(circle at 80% 50%, rgba(130, 60, 255, .55), transparent 38%),
    linear-gradient(135deg, #321078, #17102f 65%, #0d0b1d);
  border: 1px solid rgba(150, 90, 255, .55);
  box-shadow:
    0 15px 45px rgba(45, 10, 100, .35),
    inset 0 0 40px rgba(120, 50, 255, .12);
}

.welcome-card::before {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  right: 40px;
  top: -30px;
  border-radius: 50%;
  border: 1px solid rgba(190, 130, 255, .25);
  box-shadow:
    0 0 0 25px rgba(150, 80, 255, .05),
    0 0 0 50px rgba(150, 80, 255, .04);
}

.welcome-text {
  position: relative;
  z-index: 2;
}

.welcome-small {
  color: #c4a7ff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

.welcome-title {
  font-size: 38px;
  font-weight: 800;
  color: white;
}

.welcome-subtitle {
  color: #c9b8ec;
  font-size: 16px;
  margin-top: 8px;
}
.headphone-glow {
  position: relative;
  width: 110px;
  height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 72px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(170, 90, 255, .30),
    rgba(90, 40, 180, .08) 55%,
    transparent 70%
  );
  filter:
    drop-shadow(0 0 12px rgba(190, 100, 255, .9))
    drop-shadow(0 0 30px rgba(130, 60, 255, .65));
  animation: headphoneFloat 3s ease-in-out infinite;
}

@keyframes headphoneFloat {
  0%, 100% {
    transform: translateY(0) scale(1);
  }

  50% {
    transform: translateY(-7px) scale(1.04);
  }
}
.welcome-icon {
  position: relative;
  z-index: 2;
  font-size: 82px;
  margin-right: 20px;
  filter:
    drop-shadow(0 0 12px rgba(170, 100, 255, .9))
    drop-shadow(0 15px 20px rgba(0,0,0,.5));
}


/* SECTION */

.section-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 13px;
}

/* SONG CARD */

.song {
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(
    135deg,
    rgba(29,29,49,.96),
    rgba(18,18,31,.96)
  );
  padding: 12px;
  border: 1px solid rgba(255,255,255,.045);
  border-radius: 18px;
  margin-bottom: 11px;
  box-shadow: 0 7px 20px rgba(0,0,0,.18);
  transition:
    transform .2s ease,
    background .2s ease,
    box-shadow .2s ease;
  animation: songAppear .35s ease both;
}

.song:active {
  transform: scale(.975);
}
.song:hover {
  border-color: rgba(150, 120, 255, .30);
  box-shadow: 0 10px 28px rgba(80, 40, 160, .22);
}

@media (hover: hover) {
  .song:hover {
    transform: translateY(-2px);
    background: linear-gradient(
      135deg,
      rgba(39,39,64,.98),
      rgba(20,20,35,.98)
    );
    box-shadow: 0 10px 28px rgba(0,0,0,.28);
  }
}

/* COVER */

.cover {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  background: linear-gradient(135deg, #29284d, #151526);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid rgba(170, 100, 255, .18);
  box-shadow:
    0 6px 18px rgba(0, 0, 0, .30),
    0 0 12px rgba(130, 70, 255, .10);
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: inherit;
}

/* SONG INFO */

.info {
  flex: 1;
  min-width: 0;
  padding-right: 4px;
}

.title {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: .1px;
}

.artist {
  color: #aaa2c5;
  font-size: 12px;
  font-weight: 500;
  margin-top: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
    
/* PLAY BUTTON */

.play {
  width: 43px;
  height: 43px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, #9b5cff, #6c35d9);
  color: #fff;
  font-size: 17px;
  flex-shrink: 0;
  cursor: pointer;
  box-shadow:
    0 5px 18px rgba(130, 70, 255, .35),
    0 0 12px rgba(150, 90, 255, .18);
  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.play:hover {
  transform: scale(1.08);
  box-shadow:
    0 7px 22px rgba(130, 70, 255, .45),
    0 0 18px rgba(150, 90, 255, .28);
}

.play:active {
  transform: scale(.90);
}

/* MESSAGE */

.message {
  text-align: center;
  color: #9ca3af;
  padding: 40px 10px;
  line-height: 1.6;
}

.error {
  color: #ff8585;
  word-break: break-word;
}

/* PLAYER */

.player {
  display: none;
  background:
    linear-gradient(
      145deg,
      rgba(35, 25, 58, .98),
      rgba(15, 15, 27, .98)
    );
  border: 1px solid rgba(170, 100, 255, .16);
  border-radius: 24px;
  padding: 17px;
  margin-bottom: 24px;
  box-shadow:
    0 15px 40px rgba(0, 0, 0, .42),
    0 0 24px rgba(100, 50, 190, .08),
    inset 0 1px rgba(255, 255, 255, .05);
  animation: playerOpen .35s ease;
}

.player-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
    
/* PLAYER COVER */

.player-cover {
  width: 94px;
  height: 94px;
  border-radius: 20px;
  overflow: hidden;
  flex-shrink: 0;
  border: 1px solid rgba(170, 100, 255, .22);
  background: linear-gradient(135deg, #29284d, #151526);
  box-shadow:
    0 10px 28px rgba(0, 0, 0, .42),
    0 0 20px rgba(130, 70, 255, .14);
}

.player-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* PLAYER INFO */

.player-info {
  min-width: 0;
  padding-right: 10px;
}

.player-title {
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: .1px;
}

.player-artist {
  color: #aaa2c5;
  font-size: 12px;
  font-weight: 500;
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* PLAYER CONTROLS */

.player-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin: 17px 0 8px;
}

.player-controls button {
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, #30204f, #211735);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  box-shadow:
    0 5px 18px rgba(120, 70, 220, .25),
    inset 0 1px rgba(255,255,255,.08);
  transition: transform .18s ease, box-shadow .18s ease;
}

.player-controls button:hover {
  transform: scale(1.08);
  box-shadow:
    0 7px 22px rgba(130, 70, 255, .38),
    0 0 14px rgba(150, 90, 255, .20);
}

.player-controls button:active {
  transform: scale(.88);
}

.player-controls button:nth-child(2) {
  width: 56px;
  height: 56px;
  font-size: 23px;
  background: linear-gradient(135deg, #a45cff, #6c35d9);
  color: #fff;
  box-shadow:
    0 7px 25px rgba(130, 60, 255, .45),
    0 0 18px rgba(160, 90, 255, .25);
}
.player-controls button svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: #ffffff;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.player-controls button:nth-child(2) svg {
  width: 24px;
  height: 24px;
  fill: #ffffff;
  stroke: none;
}    

/* CLOSE */

.close-player {
  width: 34px;
  height: 34px;
  border: 1px solid rgba(170, 100, 255, .16);
  border-radius: 50%;
  background: linear-gradient(
    135deg,
    rgba(48, 32, 79, .95),
    rgba(32, 24, 54, .95)
  );
  color: #ffffff;
  font-size: 17px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 5px 15px rgba(0, 0, 0, .25),
    0 0 10px rgba(130, 70, 255, .08);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.close-player:hover {
  transform: scale(1.08);
  background: linear-gradient(
    135deg,
    rgba(70, 45, 105, .98),
    rgba(40, 28, 68, .98)
  );
  box-shadow:
    0 7px 18px rgba(0, 0, 0, .3),
    0 0 14px rgba(150, 90, 255, .18);
}

.close-player:active {
  transform: scale(.88);
}

/* VIDEO */

.video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 18px;
  background: #08080d;
  margin-top: 10px;
  border: 1px solid rgba(170, 100, 255, .14);
  box-shadow:
    0 10px 28px rgba(0, 0, 0, .35),
    0 0 18px rgba(120, 60, 220, .08);
}

.video-wrapper iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

/* ANIMATIONS */

@keyframes songAppear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes playerOpen {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* MOBILE */

@media (max-width: 480px) {

  body {
    padding: 13px;
  }

  .logo {
    font-size: 28px;
  }

  .header {
    padding-top: 14px;
  }

  .song {
    padding: 11px;
  }

  .cover {
    width: 56px;
    height: 56px;
  }

  .player {
    padding: 14px;
  }

  .welcome-card {
    min-height: 180px;
    padding: 20px;
    border-radius: 22px;
  }

  .welcome-title {
    font-size: 28px;
  }

  .welcome-subtitle {
    font-size: 13px;
  }

  .welcome-icon {
    margin-right: 0;
  }

  .headphone-glow {
    font-size: 65px;
  }
}

#moonifyAudio {
  width: 100%;
  margin-top: 12px;
  border-radius: 14px;
  accent-color: #9b5cff;
  filter: drop-shadow(0 6px 16px rgba(100, 50, 190, .18));
}

/* RECENTLY PLAYED */

.recent-section {
  margin: 4px 0 26px;
}

.recent-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
}

.recent-header .section-title {
  margin: 0;
}

.see-all {
  border: none;
  background: transparent;
  color: #a978ff;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 0;
  cursor: pointer;
}

.recent-list {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 2px 2px 8px;
  scrollbar-width: none;
}

.recent-list::-webkit-scrollbar {
  display: none;
}

.recent-card {
  min-width: 145px;
  max-width: 145px;
  padding: 10px;
  border-radius: 17px;
  background: linear-gradient(
    145deg,
    rgba(35, 30, 57, .96),
    rgba(19, 17, 31, .96)
  );
  border: 1px solid rgba(255, 255, 255, .06);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .22);
}

.recent-cover {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 13px;
  background: linear-gradient(
    135deg,
    #302653,
    #171525
  );
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  overflow: hidden;
}

.recent-info {
  min-width: 0;
  margin-top: 10px;
}

.recent-title {
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.recent-artist {
  color: #8f8aa3;
  font-size: 11px;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
    
/* MOONIFY HOME HEADER */

</style>
      
</head>

<body>

  <div class="header">

  <div class="header-top">

      🌙 Moonify

  </div>

<div class="search-wrap">
  <span class="search-icon">⌕</span>

  <input
    id="search"

  >

<!-- PLAYER -->

<div id="player" class="player">

  <div class="player-header">

    <div class="player-cover">

</div>

</div>

<!-- RECENTLY PLAYED -->

    <button class="see-all" type="button">See all</button>
  </div>

</div>

<div class="section-title">🎵 Songs</div>

<div id="songs">
  <div class="message">
    Loading songs...
  </div>
</div>

<script>
  
    const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

    let songs = [];
let currentSongIndex = -1;
console.log("Moonify JS loaded");

    async function loadSongs() {

      const container =
        document.getElementById("songs");

      try {

        const configResponse =
  await fetch("/api/config");

console.log("CONFIG RESPONSE:", configResponse.status);
        
        if (!configResponse.ok) {
          throw new Error(
            "Could not load Supabase configuration."
          );
        }

        const config =
          await configResponse.json();

        if (!config.url || !config.key) {
          throw new Error(
            "Supabase configuration is missing."
          );
        }

        const supabaseClient =
          window.supabase.createClient(
            config.url,
            config.key
          );

        const { data, error } =
          await supabaseClient
            .from("songs")
            .select("*");
        if (error) {
          throw new Error(error.message);
        }

        songs = data || [];

        displaySongs(songs);

           } catch (error) {
        console.error(
          "Moonify error:",
          error
        );

        container.innerHTML = `
          <div class="message error">
            ❌ ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function displaySongs(list) {

      const container =
        document.getElementById("songs");

      if (!list.length) {

        container.innerHTML = `
          <div class="message">
            No songs published yet.
          </div>
        `;

        return;
      }

      container.innerHTML =
        list.map((song, index) => `

          <div class="song">

            <div class="cover">
  ${
    song.cover_url
      ? `<img src="${escapeHtml(song.cover_url)}" alt="Cover">`
      : "🎵"
  }
</div>

            <div class="info">

              <div class="title">
                ${escapeHtml(
                  song.title || "Unknown"
                )}
              </div>

              <div class="artist">
                ${escapeHtml(
                  song.artist || "Unknown Artist"
                )}
              </div>

            </div>

            <button
              class="play"
              onclick="playSong(${index}, '${encodeURIComponent(song.url || "")}')"
            >
              ▶
            </button>

          </div>

        `).join("");
    }

function addToRecentlyPlayed(song) {
  if (!song) return;

  let recent = [];

  try {
    recent = JSON.parse(
      localStorage.getItem("moonifyRecentlyPlayed") || "[]"
    );
  } catch (error) {
    recent = [];
  }

  const songId =
    song.id ||
    song.url ||
    song.title + "|" + song.artist;

  recent = recent.filter(item => {
    const itemId =
      item.id ||
      item.url ||
      item.title + "|" + item.artist;

    return itemId !== songId;
  });

  recent.unshift({
    id: songId,
    title: song.title || "Unknown",
    artist: song.artist || "Unknown Artist",
    cover_url: song.cover_url || "",
    url: song.url || ""
  });

  recent = recent.slice(0, 10);

  localStorage.setItem(
    "moonifyRecentlyPlayed",
    JSON.stringify(recent)
  );

  displayRecentlyPlayed();
}


function displayRecentlyPlayed() {
  const container = document.getElementById("recentList");

  if (!container) return;

  let recent = [];

  try {
    recent = JSON.parse(
      localStorage.getItem("moonifyRecentlyPlayed") || "[]"
    );
  } catch (error) {
    recent = [];
  }

  if (!recent.length) {
    container.innerHTML = "";
    return;
  }

  container.innerHTML = recent.map(song => `
    <div class="recent-card">

      <div class="recent-cover">
        ${
          song.cover_url
            ? `<img src="${escapeHtml(song.cover_url)}" alt="Cover">`
            : "🎵"
        }
      </div>

      <div class="recent-info">

        <div class="recent-title">
          ${escapeHtml(song.title)}
        </div>

        <div class="recent-artist">
          ${escapeHtml(song.artist)}
        </div>

      </div>

    </div>
  `).join("");
}
  
function playSong(index, encodedUrl) {

  currentSongIndex = index;

  const url = decodeURIComponent(encodedUrl);

  if (!url) {
    return;
  }

const song = songs[index];

addToRecentlyPlayed(song);
  
  const player = document.getElementById("player");
  const iframe = document.getElementById("youtubePlayer");
  const title = document.getElementById("playerTitle");
  const artist = document.getElementById("playerArtist");
  const cover = document.getElementById("playerCover");

  title.textContent = song?.title || "Now Playing";
  artist.textContent = song?.artist || "Moonify";

  if (cover) {
    cover.src = song && song.cover_url ? song.cover_url : "";
    cover.style.display = song?.cover_url ? "block" : "none";
  }

  if (
    url.toLowerCase().includes(".mp3") ||
    url.includes("/storage/v1/object/")
  ) {

    iframe.src = "";
    iframe.style.display = "none";

    const videoWrapper =
      document.querySelector(".video-wrapper");

    if (videoWrapper) {
      videoWrapper.style.display = "none";
    }

    player.style.display = "block";

    let audio =
      document.getElementById("moonifyAudio");

    if (!audio) {
      audio = document.createElement("audio");

      audio.id = "moonifyAudio";
      audio.controls = true;
      audio.controlsList = "nodownload";
      audio.style.width = "100%";
      audio.style.marginTop = "10px";

      player.appendChild(audio);
    }

    audio.src = url;
    audio.style.display = "block";

    audio.play().catch(() => {});

    audio.onplay = () => {
      const button =
        document.querySelector(
          ".player-controls button:nth-child(2)"
        );

      if (button) {
        button.innerHTML = `
  <svg class="main-play-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6 5h4v14H6zM14 5h4v14h-4z"></path>
  </svg>
`;
      }
    };

    audio.onpause = () => {
      const button =
        document.querySelector(
          ".player-controls button:nth-child(2)"
        );

      if (button) {
        button.innerHTML = `
  <svg class="main-play-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M8 5v14l11-7L8 5z"></path>
  </svg>
`;
      }
    };

    player.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

    return;
  }

  const videoId = getYouTubeVideoId(url);

  if (!videoId) {
    window.open(url, "_blank");
    return;
  }

  const audio =
    document.getElementById("moonifyAudio");

  if (audio) {
    audio.pause();
    audio.style.display = "none";
  }

  const videoWrapper =
    document.querySelector(".video-wrapper");

  if (videoWrapper) {
    videoWrapper.style.display = "block";
  }

  iframe.style.display = "block";

  iframe.src =
    "https://www.youtube-nocookie.com/embed/" +
    videoId +
    "?autoplay=1&rel=0";

  player.style.display = "block";

  player.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}
function nextSong() {
  if (!songs.length) return;

  const nextIndex =
    currentSongIndex >= songs.length - 1
      ? 0
      : currentSongIndex + 1;

  const song = songs[nextIndex];

  playSong(
    nextIndex,
    encodeURIComponent(song.url || "")
  );
}

function previousSong() {
  if (!songs.length) return;

  const previousIndex =
    currentSongIndex <= 0
      ? songs.length - 1
      : currentSongIndex - 1;

  const song = songs[previousIndex];

  playSong(
    previousIndex,
    encodeURIComponent(song.url || "")
  );
}

function togglePlay() {
  const audio =
    document.getElementById("moonifyAudio");

  if (!audio) return;

  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
    }
    


    function closePlayer() {

      const player =
        document.getElementById("player");

      const iframe =
        document.getElementById("youtubePlayer");

      iframe.src = "";

      player.style.display = "none";
    }


    function getYouTubeVideoId(url) {

      try {

        const parsed =
          new URL(url);

        const hostname =
          parsed.hostname.toLowerCase();

        if (
          hostname === "youtu.be"
        ) {

          return parsed.pathname
            .replace("/", "")
            .split("?")[0];

        }

        if (
          hostname.includes("youtube.com")
        ) {

          if (
            parsed.pathname === "/watch"
          ) {

            return parsed.searchParams.get("v");

          }

          if (
            parsed.pathname.startsWith("/shorts/")
          ) {

            return parsed.pathname
              .split("/shorts/")[1]
              .split("/")[0];

          }

          if (
            parsed.pathname.startsWith("/embed/")
          ) {

            return parsed.pathname
              .split("/embed/")[1]
              .split("/")[0];

          }
        }

      } catch (error) {

        console.error(
          "Invalid URL:",
          error
        );

      }

      return null;
    }


    function escapeHtml(text) {

      return String(text)
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }


    document
      .getElementById("search")
      .addEventListener(
        "input",
        function () {

          const query =
            this.value
              .toLowerCase()
              .trim();

          const filtered =
            songs.filter(song =>

              (song.title || "")
                .toLowerCase()
                .includes(query)

              ||

              (song.artist || "")
                .toLowerCase()
                .includes(query)

            );

          displaySongs(filtered);

        }
      );


    loadSongs();
    displayRecentlyPlayed();
  
  </script>
