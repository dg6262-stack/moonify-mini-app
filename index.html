<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonify</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background:
    radial-gradient(circle at top, #20204a 0%, #0b0b16 42%, #06060c 100%);
  color: #fff;
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 30px;
}

/* HEADER */

.header {
  text-align: left;
  padding: 18px 4px 10px;
}

.logo {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -1px;
}

.subtitle {
  color: #9295a7;
  margin-top: 5px;
  font-size: 13px;
}

/* SEARCH */

.search {
  width: 100%;
  padding: 15px 18px;
  border: 1px solid rgba(255,255,255,.06);
  outline: none;
  border-radius: 17px;
  background: rgba(25,25,42,.92);
  color: white;
  margin: 16px 0 24px;
  font-size: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,.2);
  transition: .25s ease;
}

.search::placeholder {
  color: #777b8e;
}

.search:focus {
  border-color: rgba(150,120,255,.55);
  box-shadow: 0 0 0 3px rgba(130,100,255,.10);
}

/* SECTION */

.section-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 13px;
}

/* SONG CARD */

.song {
  display: flex;
  align-items: center;
  gap: 13px;
  background: linear-gradient(
    135deg,
    rgba(29,29,49,.96),
    rgba(18,18,31,.96)
  );
  padding: 12px;
  border: 1px solid rgba(255,255,255,.045);
  border-radius: 18px;
  margin-bottom: 11px;
  box-shadow: 0 7px 20px rgba(0,0,0,.18);
  transition:
    transform .2s ease,
    background .2s ease,
    box-shadow .2s ease;
  animation: songAppear .35s ease both;
}

.song:active {
  transform: scale(.975);
}

@media (hover: hover) {
  .song:hover {
    transform: translateY(-2px);
    background: linear-gradient(
      135deg,
      rgba(39,39,64,.98),
      rgba(20,20,35,.98)
    );
    box-shadow: 0 10px 28px rgba(0,0,0,.28);
  }
}

/* COVER */

.cover {
  width: 58px;
  height: 58px;
  border-radius: 14px;
  background: linear-gradient(135deg, #29284d, #151526);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  flex-shrink: 0;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,.3);
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: inherit;
}

/* SONG INFO */

.info {
  flex: 1;
  min-width: 0;
}

.title {
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  color: #8f92a5;
  font-size: 12px;
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* PLAY BUTTON */

.play {
  width: 43px;
  height: 43px;
  border: none;
  border-radius: 50%;
  background: #fff;
  color: #08080d;
  font-size: 17px;
  flex-shrink: 0;
  cursor: pointer;
  box-shadow: 0 5px 18px rgba(255,255,255,.12);
  transition: transform .18s ease, box-shadow .18s ease;
}

.play:active {
  transform: scale(.88);
  box-shadow: 0 2px 8px rgba(255,255,255,.08);
}

/* MESSAGE */

.message {
  text-align: center;
  color: #9ca3af;
  padding: 40px 10px;
  line-height: 1.6;
}

.error {
  color: #ff8585;
  word-break: break-word;
}

/* PLAYER */

.player {
  display: none;
  background:
    linear-gradient(
      145deg,
      rgba(35,35,58,.98),
      rgba(15,15,27,.98)
    );
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 22px;
  padding: 16px;
  margin-bottom: 22px;
  box-shadow:
    0 15px 40px rgba(0,0,0,.4),
    inset 0 1px rgba(255,255,255,.04);
  animation: playerOpen .35s ease;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

/* PLAYER COVER */

.player-cover {
  width: 94px;
  height: 94px;
  border-radius: 17px;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 8px 25px rgba(0,0,0,.4);
}

.player-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* PLAYER INFO */

.player-info {
  min-width: 0;
  padding-right: 10px;
}

.player-title {
  font-size: 16px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-artist {
  color: #8f92a5;
  font-size: 12px;
  margin-top: 5px;
}

/* PLAYER CONTROLS */

.player-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin: 17px 0 8px;
}

.player-controls button {
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: #28283f;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: transform .18s ease, background .18s ease;
}

.player-controls button:active {
  transform: scale(.86);
}

.player-controls button:nth-child(2) {
  width: 56px;
  height: 56px;
  font-size: 23px;
  background: white;
  color: #08080d;
  box-shadow: 0 6px 22px rgba(255,255,255,.14);
}

/* CLOSE */

.close-player {
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: #28283f;
  color: white;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform .18s ease;
}

.close-player:active {
  transform: scale(.85);
}

/* VIDEO */

.video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 15px;
  background: #000;
  margin-top: 8px;
}

.video-wrapper iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

/* ANIMATIONS */

@keyframes songAppear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes playerOpen {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* MOBILE */

@media (max-width: 480px) {

  body {
    padding: 13px;
  }

  .logo {
    font-size: 28px;
  }

  .header {
    padding-top: 14px;
  }

  .song {
    padding: 11px;
  }

  .cover {
    width: 56px;
    height: 56px;
  }

  .player {
    padding: 14px;
  }
}
  </style>
      

</head>

<body>

  <div class="header">
  <div class="logo">🌙 Moonify</div>
  <div class="subtitle">Your music space</div>
</div>

<div class="search-wrap">
  <span class="search-icon">⌕</span>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Search songs..."
  >
</div>

<!-- PLAYER -->

<div id="player" class="player">

  <div class="player-header">

    <div class="player-cover">
      <img
        id="playerCover"
        src=""
        alt="Cover"
      >
    </div>

    <div class="player-info">
      <div id="playerTitle" class="player-title">
        Now Playing
      </div>

      <div id="playerArtist" class="player-artist">
        Moonify
      </div>
    </div>

    <button
      class="close-player"
      onclick="closePlayer()"
    >
      ✕
    </button>

  </div>

  <div class="player-controls">
    <button onclick="previousSong()">⏮️</button>
    <button onclick="togglePlay()">▶️</button>
    <button onclick="nextSong()">⏭️</button>
  </div>

  <div class="video-wrapper">
    <iframe
      id="youtubePlayer"
      src=""
      title="Moonify Player"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

</div>

  <div class="section-title">🎵 Songs</div>

  <div id="songs">
    <div class="message">
      Loading songs...
    </div>
  </div>

  <script>

    const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

    let songs = [];
let currentSongIndex = -1;
console.log("Moonify JS loaded");

    async function loadSongs() {

      const container =
        document.getElementById("songs");

      try {

        const configResponse =
  await fetch("/api/config");

console.log("CONFIG RESPONSE:", configResponse.status);
        
        if (!configResponse.ok) {
          throw new Error(
            "Could not load Supabase configuration."
          );
        }

        const config =
          await configResponse.json();

        if (!config.url || !config.key) {
          throw new Error(
            "Supabase configuration is missing."
          );
        }

        const supabaseClient =
          window.supabase.createClient(
            config.url,
            config.key
          );

        const { data, error } =
          await supabaseClient
            .from("songs")
            .select("*");
        if (error) {
          throw new Error(error.message);
        }

        songs = data || [];

        displaySongs(songs);

           } catch (error) {
        console.error(
          "Moonify error:",
          error
        );

        container.innerHTML = `
          <div class="message error">
            ❌ ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function displaySongs(list) {

      const container =
        document.getElementById("songs");

      if (!list.length) {

        container.innerHTML = `
          <div class="message">
            No songs published yet.
          </div>
        `;

        return;
      }

      container.innerHTML =
        list.map((song, index) => `

          <div class="song">

            <div class="cover">
  ${
    song.cover_url
      ? `<img src="${escapeHtml(song.cover_url)}" alt="Cover">`
      : "🎵"
  }
</div>

            <div class="info">

              <div class="title">
                ${escapeHtml(
                  song.title || "Unknown"
                )}
              </div>

              <div class="artist">
                ${escapeHtml(
                  song.artist || "Unknown Artist"
                )}
              </div>

            </div>

            <button
              class="play"
              onclick="playSong(${index}, '${encodeURIComponent(song.url || "")}')"
            >
              ▶
            </button>

          </div>

        `).join("");
    }


function playSong(index, encodedUrl) {

  currentSongIndex = index;

  const url = decodeURIComponent(encodedUrl);

  if (!url) {
    return;
  }

const song = songs[index];

  const player = document.getElementById("player");
  const iframe = document.getElementById("youtubePlayer");
  const title = document.getElementById("playerTitle");
  const artist = document.getElementById("playerArtist");
  const cover = document.getElementById("playerCover");

  title.textContent = song?.title || "Now Playing";
  artist.textContent = song?.artist || "Moonify";

  if (cover) {
    cover.src = song && song.cover_url ? song.cover_url : "";
    cover.style.display = song?.cover_url ? "block" : "none";
  }

  if (
    url.toLowerCase().includes(".mp3") ||
    url.includes("/storage/v1/object/")
  ) {

    iframe.src = "";
    iframe.style.display = "none";

    const videoWrapper =
      document.querySelector(".video-wrapper");

    if (videoWrapper) {
      videoWrapper.style.display = "none";
    }

    player.style.display = "block";

    let audio =
      document.getElementById("moonifyAudio");

    if (!audio) {
      audio = document.createElement("audio");

      audio.id = "moonifyAudio";
      audio.controls = true;
      audio.controlsList = "nodownload";
      audio.style.width = "100%";
      audio.style.marginTop = "10px";

      player.appendChild(audio);
    }

    audio.src = url;
    audio.style.display = "block";

    audio.play().catch(() => {});

    audio.onplay = () => {
      const button =
        document.querySelector(
          ".player-controls button:nth-child(2)"
        );

      if (button) {
        button.textContent = "⏸️";
      }
    };

    audio.onpause = () => {
      const button =
        document.querySelector(
          ".player-controls button:nth-child(2)"
        );

      if (button) {
        button.textContent = "▶️";
      }
    };

    player.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

    return;
  }

  const videoId = getYouTubeVideoId(url);

  if (!videoId) {
    window.open(url, "_blank");
    return;
  }

  const audio =
    document.getElementById("moonifyAudio");

  if (audio) {
    audio.pause();
    audio.style.display = "none";
  }

  const videoWrapper =
    document.querySelector(".video-wrapper");

  if (videoWrapper) {
    videoWrapper.style.display = "block";
  }

  iframe.style.display = "block";

  iframe.src =
    "https://www.youtube-nocookie.com/embed/" +
    videoId +
    "?autoplay=1&rel=0";

  player.style.display = "block";

  player.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}
function nextSong() {
  if (!songs.length) return;

  const nextIndex =
    currentSongIndex >= songs.length - 1
      ? 0
      : currentSongIndex + 1;

  const song = songs[nextIndex];

  playSong(
    nextIndex,
    encodeURIComponent(song.url || "")
  );
}

function previousSong() {
  if (!songs.length) return;

  const previousIndex =
    currentSongIndex <= 0
      ? songs.length - 1
      : currentSongIndex - 1;

  const song = songs[previousIndex];

  playSong(
    previousIndex,
    encodeURIComponent(song.url || "")
  );
}

function togglePlay() {
  const audio =
    document.getElementById("moonifyAudio");

  if (!audio) return;

  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
    }
    


    function closePlayer() {

      const player =
        document.getElementById("player");

      const iframe =
        document.getElementById("youtubePlayer");

      iframe.src = "";

      player.style.display = "none";
    }


    function getYouTubeVideoId(url) {

      try {

        const parsed =
          new URL(url);

        const hostname =
          parsed.hostname.toLowerCase();

        if (
          hostname === "youtu.be"
        ) {

          return parsed.pathname
            .replace("/", "")
            .split("?")[0];

        }

        if (
          hostname.includes("youtube.com")
        ) {

          if (
            parsed.pathname === "/watch"
          ) {

            return parsed.searchParams.get("v");

          }

          if (
            parsed.pathname.startsWith("/shorts/")
          ) {

            return parsed.pathname
              .split("/shorts/")[1]
              .split("/")[0];

          }

          if (
            parsed.pathname.startsWith("/embed/")
          ) {

            return parsed.pathname
              .split("/embed/")[1]
              .split("/")[0];

          }
        }

      } catch (error) {

        console.error(
          "Invalid URL:",
          error
        );

      }

      return null;
    }


    function escapeHtml(text) {

      return String(text)
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }


    document
      .getElementById("search")
      .addEventListener(
        "input",
        function () {

          const query =
            this.value
              .toLowerCase()
              .trim();

          const filtered =
            songs.filter(song =>

              (song.title || "")
                .toLowerCase()
                .includes(query)

              ||

              (song.artist || "")
                .toLowerCase()
                .includes(query)

            );

          displaySongs(filtered);

        }
      );


    loadSongs();

  </script>

</body>
  </html>
