<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moonify</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b14;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 20px 0;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .subtitle {
      color: #9ca3af;
      margin-top: 6px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 14px;
      background: #151a28;
      color: white;
      margin: 20px 0;
      font-size: 15px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #121725;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .cover {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      background: #252b45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 15px;
      font-weight: bold;
    }

    .artist {
      color: #8f96a8;
      font-size: 12px;
      margin-top: 5px;
    }

    .play {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: white;
      color: black;
      font-size: 17px;
    }

    .message {
      text-align: center;
      color: #9ca3af;
      padding: 40px 10px;
      line-height: 1.6;
    }

    .error {
      color: #ff8585;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🌙 Moonify</div>
    <div class="subtitle">Your music space</div>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔍 Search songs..."
  >

  <div class="section-title">🎵 Songs</div>

  <div id="songs">
    <div class="message">Loading songs...</div>
  </div>

  <script>

    // Telegram Mini App
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Supabase
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const songsContainer = document.getElementById("songs");

    let songs = [];

    async function loadSongs() {

      try {

        if (
          SUPABASE_URL === "YOUR_SUPABASE_URL" ||
          SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"
        ) {
          throw new Error(
            "Supabase URL or anon key is not connected."
          );
        }

        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

        const result = await client
          .from("songs")
          .select("title, artist, url");

        if (result.error) {
          throw new Error(result.error.message);
        }

        songs = result.data || [];

        displaySongs(songs);

      } catch (error) {

        console.error("Moonify error:", error);

        songsContainer.innerHTML = `
          <div class="message error">
            ❌ ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function displaySongs(list) {

      if (!list.length) {
        songsContainer.innerHTML = `
          <div class="message">
            No songs published yet.
          </div>
        `;
        return;
      }

      songsContainer.innerHTML = list.map(song => {

        const title = escapeHtml(song.title || "Unknown");
        const artist = escapeHtml(song.artist || "Unknown Artist");
        const url = encodeURIComponent(song.url || "");

        return `
          <div class="song">

            <div class="cover">
              🎵
            </div>

            <div class="info">
              <div class="title">
                ${title}
              </div>

              <div class="artist">
                ${artist}
              </div>
            </div>

            <button
              class="play"
              onclick="playSong('${url}')"
            >
              ▶
            </button>

          </div>
        `;

      }).join("");
    }

    function playSong(encodedUrl) {

      const url = decodeURIComponent(encodedUrl);

      if (!url) {
        return;
      }

      window.open(url, "_blank");
    }

    function escapeHtml(text) {

      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document
      .getElementById("search")
      .addEventListener("input", function () {

        const query = this.value.toLowerCase();

        const filtered = songs.filter(song => {

          const title = (song.title || "").toLowerCase();
          const artist = (song.artist || "").toLowerCase();

          return (
            title.includes(query) ||
            artist.includes(query)
          );
        });

        displaySongs(filtered);
      });

    loadSongs();

  </script>

</body>
</html>
