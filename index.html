<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonify</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b14;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 20px 0;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .subtitle {
      color: #9ca3af;
      margin-top: 6px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 0;
      outline: 0;
      border-radius: 14px;
      background: #151a28;
      color: white;
      margin: 20px 0;
      font-size: 15px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #121725;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .cover {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      background: linear-gradient(135deg, #312e81, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 15px;
      font-weight: bold;
    }

    .artist {
      color: #8f96a8;
      font-size: 12px;
      margin-top: 5px;
    }

    .play {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: white;
      color: black;
      font-size: 17px;
    }

    .empty {
      text-align: center;
      color: #777f92;
      padding: 40px 10px;
    }

    .error {
      text-align: center;
      color: #ff8a8a;
      padding: 30px 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🌙 Moonify</div>
    <div class="subtitle">Your music space</div>
  </div>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Search songs..."
  >

  <div class="section-title">🎵 Songs</div>

  <div id="songs">
    <div class="empty">Loading songs...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const SUPABASE_URL = "https://kalcgkaxdfcuqspnmqtq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthbGNna2F4ZGZjdXFzcG5tcXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTMzNTEsImV4cCI6MjEwMzQ4OTM1MX0.O0ZZ46beCfcMlbPH1bOf2rHZImuz_CPsVI2zNKlPBhY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    let songs = [];

    async function loadSongs() {
      const container = document.getElementById("songs");

      const { data, error } = await supabaseClient
        .from("songs")
        .select("title, artist, url")
        .order("id", { ascending: false });

      if (error) {
        console.error(error);
        container.innerHTML = `
          <div class="error">
            Unable to load songs.
          </div>
        `;
        return;
      }

      songs = data || [];
      showSongs(songs);
    }

    function showSongs(list) {
      const container = document.getElementById("songs");

      if (!list.length) {
        container.innerHTML = `
          <div class="empty">
            No songs published yet.
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(song => `
        <div class="song">
          <div class="cover">🎵</div>

          <div class="info">
            <div class="title">
              ${escapeHtml(song.title || "Unknown")}
            </div>

            <div class="artist">
              ${escapeHtml(song.artist || "Unknown artist")}
            </div>
          </div>

          <button
            class="play"
            onclick="openSong('${encodeURIComponent(song.url || "")}')"
          >
            ▶
          </button>
        </div>
      `).join("");
    }

    function openSong(encodedUrl) {
      const url = decodeURIComponent(encodedUrl);

      if (url) {
        window.open(url, "_blank");
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("search").addEventListener("input", function () {
      const query = this.value.toLowerCase();

      const filtered = songs.filter(song =>
        (song.title || "").toLowerCase().includes(query) ||
        (song.artist || "").toLowerCase().includes(query)
      );

      showSongs(filtered);
    });

    loadSongs();
  </script>

</body>
</html>
