<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonify</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b14;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 20px 0;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .subtitle {
      color: #9ca3af;
      margin-top: 6px;
      font-size: 14px;
    }

    .search {
      width: 100%;
      padding: 14px 16px;
      border: none;
      outline: none;
      border-radius: 14px;
      background: #151a28;
      color: white;
      font-size: 15px;
      margin: 20px 0;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #121725;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .cover {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      background: linear-gradient(135deg, #312e81, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .info {
      flex: 1;
    }

    .title {
      font-size: 15px;
      font-weight: bold;
    }

    .artist {
      color: #8f96a8;
      font-size: 12px;
      margin-top: 5px;
    }

    .play {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: white;
      color: black;
      font-size: 17px;
    }

    .empty {
      text-align: center;
      color: #777f92;
      padding: 40px 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🌙 Moonify</div>
    <div class="subtitle">Your music space</div>
  </div>

  <input
    class="search"
    type="text"
    placeholder="🔍 Search songs..."
    id="search"
  >

  <div class="section-title">🎵 Songs</div>

  <div id="songs">
    <div class="empty">
      No songs published yet.
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const songs = [];

    function showSongs(list) {
      const container = document.getElementById("songs");

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty">
            No songs found.
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(song => `
        <div class="song">
          <div class="cover">🎵</div>

          <div class="info">
            <div class="title">${song.title}</div>
            <div class="artist">${song.artist}</div>
          </div>

          <button class="play" onclick="openSong('${song.url}')">
            ▶
          </button>
        </div>
      `).join("");
    }

    function openSong(url) {
      window.open(url, "_blank");
    }

    document.getElementById("search").addEventListener("input", function() {
      const query = this.value.toLowerCase();

      const filtered = songs.filter(song =>
        song.title.toLowerCase().includes(query) ||
        song.artist.toLowerCase().includes(query)
      );

      showSongs(filtered);
    });

    showSongs(songs);
  </script>

</body>
</html>
